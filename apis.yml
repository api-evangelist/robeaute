name: Robeaute
description: Robeauté is a Paris-based medical technology company, founded in 2017 by
  Bertrand Duplat and Joana Cartocci, developing what it calls the world's first microrobotic
  platform for the brain. Its rice-grain-sized robots are designed to navigate brain
  tissue to diagnose, treat, and monitor neurological disease, aiming to make neurosurgery
  safer and less invasive. The device is pre-market — it has not received FDA clearance
  or CE marking and is not approved for clinical use or commercial sale. Robeauté has
  raised over €40M, including a $28M Series A led by Plural, Cherry Ventures, Kindred
  Ventures, and Brainlab, and operates from Paris with a San Francisco office opened
  in 2026. The company publishes no public API, developer platform, or SDK.
